<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Files</title><link rel="stylesheet" href="/dialog.css"></head>
<body style="font-family:system-ui;margin:24px"><h1>Files</h1><a href="/settings.html">Settings</a>
<ul id="files"><li data-name="report.pdf">report.pdf <button class="del">Delete</button></li><li data-name="photo.png">photo.png <button class="del">Delete</button></li></ul>
<script type="module">
import { confirmDialog } from "/dialog.js";
document.querySelectorAll(".del").forEach((b) => b.addEventListener("click", async () => {
  const li = b.closest("li");
  if (await confirmDialog({ title: "Delete file?", body: `${li.dataset.name} will be removed.`, confirmLabel: "Delete" })) li.remove();
}));
</script></body></html>
