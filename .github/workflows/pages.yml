name: Docs site

on:
  push:
    branches: [main]
    paths: ['site/**', 'install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run types:check
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  installers:
    needs: deploy
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: the short install URLs serve text PowerShell and sh can run
        run: |
          $ps = Invoke-RestMethod https://ga-mo.github.io/twin/install.ps1
          if ($ps -isnot [string] -or $ps -notmatch "scriptblock") { throw "install.ps1 came back as $($ps.GetType().Name): $ps" }
          [scriptblock]::Create($ps) | Out-Null
          $sh = Invoke-WebRequest -UseBasicParsing https://ga-mo.github.io/twin/install.sh
          if ($sh.StatusCode -ne 200) { throw "install.sh $($sh.StatusCode)" }
